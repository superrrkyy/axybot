<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f0c29"/><stop offset=".55" stop-color="#302b63"/><stop offset="1" stop-color="#0b3d2e"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" x2="1">
      <stop offset="0" stop-color="#c4b5fd"/><stop offset=".5" stop-color="#ffffff"/><stop offset="1" stop-color="#4ade80"/>
    </linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#7c3aed" stop-opacity=".5"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></radialGradient>
    <radialGradient id="glow2"><stop offset="0" stop-color="#22c55e" stop-opacity=".35"/><stop offset="1" stop-color="#22c55e" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="320" fill="url(#bg)"/>
  <circle cx="330" cy="150" r="220" fill="url(#glow)"><animate attributeName="r" values="200;250;200" dur="6s" repeatCount="indefinite"/></circle>
  <circle cx="900" cy="170" r="200" fill="url(#glow2)"><animate attributeName="r" values="230;180;230" dur="7s" repeatCount="indefinite"/></circle>

  <!-- robot -->
  <g transform="translate(150 70)">
    <animateTransform attributeName="transform" type="translate" values="150 70;150 60;150 70" dur="3s" repeatCount="indefinite"/>
    <line x1="80" y1="0" x2="80" y2="28" stroke="#c4b5fd" stroke-width="5"/>
    <circle cx="80" cy="0" r="9" fill="#4ade80"><animate attributeName="opacity" values="1;.3;1" dur="1.5s" repeatCount="indefinite"/></circle>
    <rect x="10" y="28" width="140" height="110" rx="28" fill="#1e1b4b" stroke="#a78bfa" stroke-width="4"/>
    <rect x="30" y="52" width="100" height="50" rx="16" fill="#0d1117"/>
    <circle cx="58" cy="77" r="9" fill="#4ade80"><animate attributeName="r" values="9;1;9" dur="4s" keyTimes="0;.05;.1" repeatCount="indefinite"/></circle>
    <circle cx="102" cy="77" r="9" fill="#4ade80"><animate attributeName="r" values="9;1;9" dur="4s" keyTimes="0;.05;.1" repeatCount="indefinite"/></circle>
    <path d="M60 118 Q80 130 100 118" stroke="#c4b5fd" stroke-width="4" fill="none" stroke-linecap="round"/>
    <rect x="0" y="62" width="10" height="40" rx="5" fill="#a78bfa"/><rect x="150" y="62" width="10" height="40" rx="5" fill="#a78bfa"/>
  </g>

  <!-- chat bubbles -->
  <g font-family="Consolas, Menlo, monospace" font-size="18">
    <g opacity="0"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.85;1" dur="6s" repeatCount="indefinite"/>
      <rect x="840" y="200" width="150" height="40" rx="14" fill="#1f2937"/><text x="860" y="226" fill="#e5e7eb">ping</text></g>
    <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.25;.35;.85;1" dur="6s" repeatCount="indefinite"/>
      <rect x="880" y="250" width="270" height="40" rx="14" fill="#166534"/><text x="900" y="276" fill="#dcfce7">🏓 Pong! bot aktif</text></g>
  </g>

  <text x="640" y="135" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="92" font-weight="800" letter-spacing="6" fill="url(#txt)">axybot</text>
  <text x="640" y="180" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="24" fill="#c4b5fd" letter-spacing="3">CORE V5 • WhatsApp Bot Framework</text>
</svg>
